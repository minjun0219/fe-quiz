name: Quiz Generate

on:
  workflow_dispatch:
    inputs:
      categories:
        description: "쉼표 구분 카테고리 (비우면 1개 랜덤). 매뉴얼 burst 시 'react,css,html' 식으로 N개 지정 가능."
        required: false
        default: ""
      difficulties:
        description: "쉼표 구분 난이도. 카테고리 수만큼 순환 적용(부족하면 첫 항목으로 wrap)."
        required: false
        default: "easy,medium,hard"
      dry_run:
        description: "true면 PR 미생성"
        type: boolean
        default: false
  schedule:
    # KST 월~금 05:00 출근길 검수 타이밍.
    # KST 05:00 = UTC 20:00 (전날). KST 월~금 = UTC 일~목 → dow=0-4.
    - cron: "0 20 * * 0-4"

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: quiz-generate
  cancel-in-progress: false

jobs:
  # 검수 적체 방지: 아직 머지/클로즈 안 된 자동출제 PR이 남아 있으면
  # 이번 회차는 통째로 스킵한다(=새 PR을 더 쌓지 않는다).
  # 검수가 binding constraint 라 PR이 무한정 누적되는 걸 막는 게 핵심.
  guard:
    # 무한 루프 방지: 이 워크플로가 만든 브랜치에서는 다시 돌지 않음.
    # schedule/workflow_dispatch 에선 head_ref 가 비므로 ref_name 으로 판정.
    if: "!startsWith(github.ref_name, 'claude/generate-quiz-')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Skip if an auto-generated PR is still open
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 'generated' 라벨이 붙은 열린 PR = 아직 검수 안 끝난 자동출제분.
          # head 브랜치 prefix 가 아니라 라벨로 판정 — create-pull-request 가
          # 항상 generated/automated 라벨을 달기 때문에 단일 출처로 충분.
          # 존재 여부만 필요하므로 --limit 1 (기본 30 한도로 개수 세지 않음).
          OPEN=$(gh pr list --repo "$REPO" --state open --label generated \
            --limit 1 --json number --jq 'length')
          if [ "$OPEN" -gt 0 ]; then
            echo "::notice::열린 자동출제 PR이 남아 있어 이번 회차를 스킵합니다. 검수 후 머지/클로즈하면 다음 스케줄부터 재개됩니다."
            echo "열린 자동출제 PR 존재 — 스킵" >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm 버전은 package.json 의 `packageManager: "pnpm@x.y.z"` 가 SoT.
      # 여기서 `with: version: …` 을 따로 지정하면 v6 action 이 충돌로 fail 함.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Pick categories
        id: pick
        env:
          INPUT_CATS: ${{ github.event.inputs.categories }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_CATS}" ]; then
            CATS="${INPUT_CATS}"
          else
            # 디렉터리만 추려 run_id 시드로 랜덤 1개 — 검수 품질이 binding constraint 라
            # 기본은 1/일. burst가 필요하면 workflow_dispatch의 categories 입력에
            # "react,css,html" 식으로 넘기면 그대로 처리됨(아래 인프라가 N개 받음).
            CATS=$(find content/questions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | shuf --random-source=<(yes "${RUN_ID}") -n 1 \
              | paste -sd ',' -)
          fi
          echo "cats=${CATS}" >> "$GITHUB_OUTPUT"
          echo "선택된 카테고리: ${CATS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare batch
        env:
          CATS: ${{ steps.pick.outputs.cats }}
          DIFFS: ${{ github.event.inputs.difficulties || 'easy,medium,hard' }}
        run: pnpm questions:prepare-batch "${CATS}" "${DIFFS}"

      - name: Generate (Opus authors)
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 15
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/generate-quiz"
          claude_args: |
            --mcp-config .mcp.json
            --allowedTools Task,Read,Write

      - name: Write YAML (deterministic)
        run: pnpm questions:write-generated

      - name: Rebuild index
        run: pnpm questions:index

      # Workers 런타임 번들 — 잊으면 Final gate의 questions:bundle:check가 실패
      - name: Rebuild question bundle
        run: pnpm questions:bundle

      - name: Verify schema + lint
        run: pnpm questions:check

      - name: Resolve generated paths
        id: files
        run: |
          set -euo pipefail
          PATHS=$(git diff --name-only --diff-filter=A -- 'content/questions/**' | tr '\n' ' ')
          echo "paths=${PATHS}" >> "$GITHUB_OUTPUT"
          echo "생성된 파일: ${PATHS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Review (Sonnet reviewers)
        if: steps.files.outputs.paths != ''
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 20
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/review-quiz ${{ steps.files.outputs.paths }}"
          claude_args: |
            --mcp-config .mcp.json
            --allowedTools Task,Read,Write,WebFetch,WebSearch,mcp__context7__resolve-library-id,mcp__context7__get-library-docs

      - name: Apply review verdicts
        if: steps.files.outputs.paths != ''
        env:
          ALLOWED_PATHS: ${{ steps.files.outputs.paths }}
        run: |
          set -euo pipefail
          if [ ! -d .cache/review ]; then
            echo "::warning::reviewer 결과 디렉터리(.cache/review)가 없습니다. 모든 파일을 그대로 유지합니다."
            exit 0
          fi
          for f in .cache/review/*.json; do
            [ -e "$f" ] || continue
            verdict=$(jq -r '.verdict // "missing"' "$f")
            target=$(jq -r '.target // ""' "$f")
            reason=$(jq -r '.reason // ""' "$f")
            if [ "$verdict" != "reject" ]; then
              continue
            fi
            if [ -z "$target" ]; then
              echo "::warning::reviewer reject without target ($f) — ignored. reason: ${reason}"
              continue
            fi
            # reviewer가 hallucinated target을 적었을 때 기존 트래킹 파일을 지우지
            # 않도록 이번 회차에 생성된 path 화이트리스트와 정확히 일치할 때만 rm.
            matched=0
            for allowed in $ALLOWED_PATHS; do
              if [ "$allowed" = "$target" ]; then
                matched=1
                break
              fi
            done
            if [ "$matched" != "1" ]; then
              echo "::warning::reviewer가 생성 화이트리스트 밖의 path '${target}'에 reject 판정 — 무시. reason: ${reason}"
              continue
            fi
            if [ ! -f "$target" ]; then
              echo "::warning::reject 대상 ${target}이 이미 없음 — skip. reason: ${reason}"
              continue
            fi
            echo "::warning::reject - ${target} (${reason})"
            rm -f "$target"
          done
          pnpm questions:index
          pnpm questions:bundle

      - name: Final gate
        run: pnpm check

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet content/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat content/ >> "$GITHUB_STEP_SUMMARY"
          fi
          # 안전장치: content/ 밖을 건드리면 즉시 실패
          if ! git diff --quiet -- ':!content' ':!lib/questions.generated.json'; then
            echo "::error::quiz-generate가 content/ 외부 파일을 수정했습니다."
            git diff --stat -- ':!content' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build PR body
        if: steps.diff.outputs.changed == 'true'
        run: pnpm exec tsx scripts/build-pr-body.ts > .cache/pr-body.md

      - name: Create draft PR
        if: >
          steps.diff.outputs.changed == 'true' &&
          github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: claude/generate-quiz-${{ github.run_id }}
          add-paths: |
            content/questions/**
            content/INDEX.md
            lib/questions.generated.json
          title: "chore(quiz): 자동 출제 (run ${{ github.run_id }})"
          body-path: .cache/pr-body.md
          commit-message: "chore(quiz): generate daily questions"
          labels: |
            generated
            automated
          draft: true
