name: Quiz Fact Check

on:
  workflow_dispatch:
    inputs:
      category:
        description: "javascript | react | css | all"
        default: "all"
        type: string
      dry_run:
        description: "수정 없이 검증만 (PR 생성 안 함)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "content/questions/**/*.yaml"
  schedule:
    # 매주 월요일 03:00 UTC = 12:00 KST
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: factcheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  factcheck:
    # head ref가 자동 생성된 factcheck 브랜치이면 무한 루프 방지를 위해 skip
    if: ${{ !startsWith(github.head_ref, 'claude/factcheck-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run /factcheck via Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/factcheck ${{ github.event.inputs.category || 'all' }}"
          mcp_config: ".mcp.json"
          allowed_tools: "Task,Read,Edit,Glob,Grep,WebFetch,WebSearch,Bash(pnpm questions:check),Bash(pnpm check),Bash(git diff:*),Bash(git status:*),mcp__context7__resolve-library-id,mcp__context7__get-library-docs"
          timeout_minutes: "25"

      - name: Verify schema and lint
        run: |
          pnpm questions:check
          pnpm check

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet content/questions/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat content/questions/ >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create draft PR
        if: >
          steps.diff.outputs.changed == 'true' &&
          github.event_name != 'pull_request' &&
          github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: claude/factcheck-${{ github.run_id }}
          title: "chore(quiz): /factcheck 자동 수정 제안"
          body: |
            `/factcheck` 스킬이 카테고리별 sub-agent로 병렬 팩트체크 후 자동 수정한 결과입니다.

            - 트리거: `${{ github.event_name }}`
            - 카테고리: `${{ github.event.inputs.category || 'all' }}`
            - 워크플로 실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ⚠️ **반드시 사람이 인용 출처(URL)를 검토한 뒤 머지하세요.** LLM이 잘못된 사양을 주장할 수 있습니다.

            상세 변경 사유는 위 워크플로 로그의 `Run /factcheck via Claude Code` 단계 출력을 참조하세요.
          commit-message: "chore(quiz): factcheck auto-fix"
          labels: |
            factcheck
            automated
          draft: true
