name: Sync Worker Secrets

# GitHub secrets → Cloudflare Worker secrets 수동 동기화.
#
# 키 값을 로컬/터미널에 노출하지 않고 worker secret을 넣는 경로:
# repo secrets에 이미 있는 값을 wrangler secret put으로 흘려 넣는다.
# 새 키로 회전할 때도 GitHub secret만 갱신하고 이 워크플로를 다시 돌리면 됨.
#
# 필요 권한: CLOUDFLARE_API_TOKEN에 Account → Workers Scripts → Edit.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "대상 환경"
        type: choice
        options:
          - both
          - production
          - preview
        default: both

permissions:
  contents: read

concurrency:
  group: sync-worker-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Put secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            both) ENVS="production preview" ;;
            *) ENVS="${{ inputs.target }}" ;;
          esac
          for E in $ENVS; do
            echo "→ ANTHROPIC_API_KEY → $E"
            printf '%s' "$ANTHROPIC_API_KEY" | pnpm exec wrangler secret put ANTHROPIC_API_KEY --env "$E"
          done
