name: Apply Supabase migrations

# dev/prod 두 Supabase 프로젝트로 분리되어 있어서 적용 시점도 분기:
#   - PR이 열리거나 push되면(=마이그레이션 동반) dev 프로젝트에 자동 적용
#   - main에 머지되어 push 이벤트가 들어오면 prod 프로젝트에 자동 적용
# 이 순서를 깨면 preview에서 검증할 길이 없어지므로 prod-first 트리거는 두지 않음.
# `db push`는 idempotent — 이미 적용된 마이그레이션은 건너뜀.
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate.yml"
  # 수동 실행은 항상 dev 대상 (workflow_dispatch는 ref와 무관하게 dev로 간주)
  workflow_dispatch:

permissions:
  contents: read

# prod 적용은 단일 큐로 직렬화. dev는 PR ref별로 격리해서 서로 안 막히게.
concurrency:
  group: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
        && 'supabase-migrate-prod'
        || format('supabase-migrate-dev-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IS_PROD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json `packageManager`가 단일 소스. 둘 다 지정 시
      # action-setup@v4가 ERR_PNPM_BAD_PM_VERSION으로 거부.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # supabase 패키지 postinstall이 native 바이너리를 받기 때문에
      # pnpm.onlyBuiltDependencies 허용 목록(package.json) 안에 있어야 함.
      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PROD_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          DEV_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$IS_PROD" = "true" ]; then
            REF="$PROD_PROJECT_REF"
            PW="$PROD_DB_PASSWORD"
            LABEL="prod"
          else
            REF="$DEV_PROJECT_REF"
            PW="$DEV_DB_PASSWORD"
            LABEL="dev"
          fi
          if [ -z "$REF" ] || [ -z "$PW" ]; then
            echo "Missing project-ref or DB password secret for $LABEL." >&2
            exit 1
          fi
          echo "Applying migrations to $LABEL ($REF)"
          pnpm exec supabase link --project-ref "$REF" --password "$PW"
          pnpm exec supabase db push --password "$PW"
