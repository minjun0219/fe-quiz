name: Apply Supabase migrations

# 머지로 main에 새 마이그레이션이 들어오면 production DB에 자동 push.
# `db push`는 idempotent — 이미 적용된 마이그레이션은 건너뜀. 이 워크플로
# 자체나 supabase CLI 버전이 바뀌어도 돌게 두 번째 path 추가.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate.yml"
  # 수동 실행도 허용 — 마이그레이션 파일 변화 없이 재시도하고 싶을 때.
  workflow_dispatch:

permissions:
  contents: read

# main에 두 PR이 동시에 머지되더라도 순차 적용되도록 직렬화.
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # supabase 패키지의 postinstall은 native 바이너리 다운로드가 필요해서
      # pnpm.onlyBuiltDependencies 허용 목록에 들어있어야 함 (package.json
      # 참조). 미허용이면 .bin/supabase가 안 만들어져 다음 step에서 not found.
      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          pnpm exec supabase link --project-ref rvqysdoflwopibqxhjop
          pnpm exec supabase db push
