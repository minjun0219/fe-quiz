name: Apply D1 migrations

# preview/prod 두 D1 데이터베이스로 분리되어 있어서 적용 시점도 분기:
#   - PR이 열리거나 push되면(=마이그레이션 동반) preview DB에 자동 적용
#   - main에 머지되어 push 이벤트가 들어오면 prod DB에 자동 적용
# 이 순서를 깨면 preview에서 검증할 길이 없어지므로 prod-first 트리거는 두지 않음.
# `wrangler d1 migrations apply`는 적용 이력 테이블(d1_migrations) 기반이라
# idempotent — 이미 적용된 마이그레이션은 건너뜀.
on:
  pull_request:
    branches: [main]
    paths:
      - "migrations/**"
      - ".github/workflows/migrate.yml"
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - ".github/workflows/migrate.yml"
  # 수동 실행은 항상 preview 대상 (workflow_dispatch는 ref와 무관하게 preview로 간주)
  workflow_dispatch:

permissions:
  contents: read

# prod 적용은 단일 큐로 직렬화. preview는 PR ref별로 격리해서 서로 안 막히게.
concurrency:
  group: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
        && 'd1-migrate-prod'
        || format('d1-migrate-preview-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IS_PROD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json `packageManager`가 단일 소스. 둘 다 지정 시
      # action-setup@v6가 ERR_PNPM_BAD_PM_VERSION으로 거부.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # production은 top-level 설정이라 --env 불필요 (wrangler.jsonc 참고)
          if [ "$IS_PROD" = "true" ]; then
            echo "Applying migrations to fe-quiz-shares (production)"
            pnpm exec wrangler d1 migrations apply fe-quiz-shares --remote
          else
            echo "Applying migrations to fe-quiz-shares-preview (preview)"
            pnpm exec wrangler d1 migrations apply fe-quiz-shares-preview --remote --env preview
          fi
