id: react-018
category: react
difficulty: easy
type: single_choice
question: |
  `useId()` 훅의 주요 용도로 가장 적절한 것은?
code: |
  function Field() {
    const id = useId()
    return (
      <>
        <label htmlFor={id}>이메일</label>
        <input id={id} />
      </>
    )
  }
choices:
  - id: a
    text: "안정적인 고유 ID를 만들어 label-input 같은 a11y 연결에 쓰며, SSR/CSR 사이의 ID 불일치(hydration mismatch)도 방지한다"
  - id: b
    text: "리스트 렌더의 `key` prop을 자동으로 생성하는 용도이다"
  - id: c
    text: "무작위 UUID를 만들어 데이터베이스 PK로 쓰기 위해 도입되었다"
  - id: d
    text: "컴포넌트가 리렌더될 때마다 새 ID로 갱신되어 캠페인 추적 ID로 쓰기 좋다"
answer: a
explanation: |
  `useId`는 트리 위치 기반으로 결정적인 ID를 만들어 돌려줘. 마운트 이후에도 같은 값을 유지해서 (d 틀림), 주로 label/input, aria-describedby, headlessui 같은 a11y 패턴에 써.
  제일 중요한 건 서버와 클라이언트에서 **같은 ID**가 나와 hydration 불일치를 막는 거야. 직접 카운터나 `Math.random()`은 그 보장이 없으니 피해야 해.
  PK나 캠페인 식별자처럼 전역 고유성이 필요하면 `crypto.randomUUID()`나 서버 생성 ID를 따로 써야 해.
tags: [ hooks, useId, a11y, ssr ]
