id: react-013
category: react
difficulty: medium
type: single_choice
question: |
  `React.lazy`로 불러오는 컴포넌트를 `<Suspense>` 없이 렌더하면 어떻게 될까요?
code: |
  const Heavy = React.lazy(() => import('./Heavy'))

  function App() {
    return <Heavy />
  }
choices:
  - id: a
    text: lazy가 자동으로 fallback을 만들어 빈 div를 보여 줘요.
  - id: b
    text: 동기로 즉시 모듈을 로딩한 뒤 렌더해요.
  - id: c
    text: 가장 가까운 Suspense 경계가 없으면 React가 에러를 던져요.
  - id: d
    text: 처음 한 번만 fallback 없이 렌더되고, 이후엔 정상 렌더돼요.
answer: c
explanation: |
  `React.lazy`로 만든 컴포넌트는 첫 렌더에서 모듈을 비동기로 불러오는 동안 렌더 트리를 "일시 중단(suspend)"시켜요. 이걸 받아 줄 `<Suspense fallback={...}>`이 상위에 없으면 React가 "A component suspended while rendering, but no fallback UI was specified" 에러를 던져서 컴포넌트가 깨져요.
  보통 라우트 단위로 `<Suspense fallback={<Spinner />}>`로 감싸는 패턴을 써요. 코드 스플리팅으로 초기 번들을 줄일 때 자주 등장해요.
tags: [ code-splitting, suspense, lazy ]
