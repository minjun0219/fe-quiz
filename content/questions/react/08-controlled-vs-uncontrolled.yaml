id: react-008
category: react
difficulty: easy
type: single_choice
question: |
  React form input에서 controlled와 uncontrolled를 구분하는 핵심 차이는?
choices:
  - id: a
    text: controlled는 onChange 핸들러가 없고, uncontrolled는 onChange가 있어요
  - id: b
    text: controlled는 input의 값을 React state로 관리하고, uncontrolled는 DOM이 자체적으로 값을 들고
      있다가 ref로 읽어요
  - id: c
    text: controlled는 form submit 시 자동으로 reset돼요
  - id: d
    text: 둘은 동작이 같고 코드 스타일만 달라요
answer: b
explanation: |
  controlled는 `value={state}` + `onChange={...}`로 React가 input 값의 단일 출처(single source of truth)를 갖는 패턴이에요.
  uncontrolled는 `defaultValue`로 초기값만 주고, 실제 값은 DOM이 알아서 들고 있다가 필요할 때 `ref.current.value`로 읽는 패턴이에요.
  controlled는 검증·동적 표시가 쉽고, uncontrolled는 큰 폼에서 리렌더 비용이 적어요. 상황에 맞게 골라 주세요.
references:
  - title: "React — <input>"
    url: "https://ko.react.dev/reference/react-dom/components/input"
  - title: "React — ref로 DOM 조작하기"
    url: "https://ko.react.dev/learn/manipulating-the-dom-with-refs"
tags: [ form, controlled, uncontrolled, ref ]
