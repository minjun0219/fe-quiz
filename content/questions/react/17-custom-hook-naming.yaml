id: react-017
category: react
difficulty: easy
type: single_choice
question: |
  커스텀 훅 이름을 `use`로 시작해야 하는 이유로 가장 적절한 것은?
choices:
  - id: a
    text: "단순한 컨벤션일 뿐 동작상 차이는 없다"
  - id: b
    text: "`use` prefix가 React와 ESLint(`react-hooks/rules-of-hooks`)가 "이 함수는 훅을 호출한다"라고 판단하는 근거라, 이름이 다르면 훅 규칙 검사가 적용되지 않는다"
  - id: c
    text: "`use`로 시작해야 React가 자동으로 모이즈해준다"
  - id: d
    text: "`use` prefix가 있어야 JSX를 반환할 수 있는 컴포넌트로 인식된다"
answer: b
explanation: |
  React 프레임워크와 린트 플러그인은 "대문자/`use` 철자"로 훅인지 아니지를 구분해. `use`가 아닌 함수는 일반 함수로 취급되고, 안에서 `useState` 같은 훅을 호출해도 "훅을 조건부로 호출했다" 같은 규칙 위반 경고를 높칠 수 있어.
  자동 메모이즈(c)나 컴포넌트 인식(d)은 React의 실제 동작과 무관해. 결론은 "훅 규칙을 안전하게 적용받으려면 prefix를 따른다"야.
tags: [ hooks, custom-hook, naming, lint ]
