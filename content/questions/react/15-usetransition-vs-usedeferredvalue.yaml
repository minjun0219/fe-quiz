id: react-015
category: react
difficulty: hard
type: multiple_choice
question: |
  `useTransition`과 `useDeferredValue`의 차이로 가장 정확한 설명은?
choices:
  - "둘 다 동일한 API이며 React 19부터는 useTransition이 deprecated된다."
  - "`useTransition`은 컴포넌트를 메모이즈하고, `useDeferredValue`는 effect 실행을 지연시킨다."
  - "둘 다 동기 렌더링을 강제해 사용자 입력 응답성을 높인다."
  - "`useTransition`은 상태 업데이트를 우선순위가 낮은 트랜지션으로 감쌀 때, `useDeferredValue`는 setter에 접근할 수 없는 props/외부 값의 반영을 늦추고 싶을 때 쓴다."
answer: 3
explanation: |
  - `useTransition`은 `startTransition(() => setState(...))`처럼 **내가 setter를 가진 상태 변경**을 "긴급하지 않은 트랜지션"으로 마킹해, 무거운 리렌더가 입력 같은 더 급한 업데이트를 막지 않도록 해 줘. 보너스로 `isPending`을 받아 로딩 표시도 가능.
  - `useDeferredValue`는 props로 받은 값처럼 **setter를 내가 들고 있지 않은 값**에 대해, 그 값의 새 버전을 늦은 우선순위로 반영시켜. 결과 측에서 한 박자 늦은 복사본을 만들어 무거운 트리에 흘려 보내는 패턴이야.
  큰 그림은 비슷하지만 "어디서 우선순위를 낮추느냐"가 달라 — 입력 측 상태 변경에 쓰면 useTransition, 받은 값을 소비하는 쪽에서 늦추고 싶으면 useDeferredValue.
tags: [concurrent, useTransition, useDeferredValue]
