id: react-012
category: react
difficulty: medium
type: multiple_choice
question: |
  React Hook 규칙에 따라 다음 중 **금지**되는 사용 패턴은?
code: |
  function Profile({ userId }) {
    if (!userId) {
      const [name, setName] = useState('')   // (가)
      return null
    }
    const data = useFetch(userId)            // (나)
    useEffect(() => {                        // (다)
      document.title = data?.name ?? ''
    }, [data])
    return <div>{data?.name}</div>
  }
choices:
  - "(가)만"
  - "(나)만"
  - "(가), (나)"
  - "(가), (다)"
answer: 0
explanation: |
  훅은 컴포넌트가 매 렌더에서 **항상 같은 순서**로 호출돼야 해. 그래서 `if`/`for`/`return` 뒤처럼 호출 여부가 바뀌는 위치에서 훅을 쓰면 안 돼.
  - (가)는 조건문 안에서 `useState`를 호출해 호출 순서가 바뀔 수 있어 금지.
  - (나) `useFetch`는 커스텀 훅이지만 컴포넌트 최상위에서 매 렌더 호출되니 OK.
  - (다) `useEffect`도 최상위 호출이라 OK.
  ESLint 플러그인 `react-hooks/rules-of-hooks`를 켜 두면 (가) 같은 패턴을 자동으로 잡아 줘.
tags: [hooks, rules-of-hooks, lint]
