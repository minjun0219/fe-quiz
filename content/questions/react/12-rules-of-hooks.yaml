id: react-012
category: react
difficulty: medium
type: multiple_choice
question: |
  React Hook 규칙에 따라 다음 코드에서 **규칙을 위반**하는 항목을 모두 고르면?
code: |
  function Profile({ userId }) {
    if (!userId) {
      const [name, setName] = useState('')   // (가)
      return null
    }
    const data = useFetch(userId)            // (나)
    useEffect(() => {                        // (다)
      document.title = data?.name ?? ''
    }, [data])
    return <div>{data?.name}</div>
  }
choices:
  - "(가)만"
  - "(가), (나)"
  - "(가), (다)"
  - "(가), (나), (다) 모두"
answer: 3
explanation: |
  훅은 컴포넌트가 매 렌더에서 **항상 같은 순서, 같은 개수**로 호출돼야 해. `if`/`for`/조기 `return` 등으로 호출 여부가 바뀌는 위치에서 훅을 쓰면 안 돼.
  - (가)는 `if (!userId)` 블록 안에서 `useState`를 호출해 명백한 위반.
  - (나) `useFetch`와 (다) `useEffect`도 `if (!userId) return null` 뒤에 위치해 있어, `userId`가 falsy인 렌더와 truthy인 렌더에서 호출 여부가 달라져 같은 위반에 해당해.
  올바른 패턴은 모든 훅을 컴포넌트 함수 최상단에서 호출하고, 분기는 그 뒤에 두는 거야:
  ```js
  function Profile({ userId }) {
    const [name, setName] = useState('')
    const data = useFetch(userId)
    useEffect(() => { document.title = data?.name ?? '' }, [data])
    if (!userId) return null
    return <div>{data?.name}</div>
  }
  ```
  ESLint 플러그인 `react-hooks/rules-of-hooks`를 켜 두면 이런 패턴을 자동으로 잡아 줘.
tags: [hooks, rules-of-hooks, lint]
