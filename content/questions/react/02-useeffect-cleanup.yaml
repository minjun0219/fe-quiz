id: react-002
category: react
difficulty: medium
type: multiple_choice
question: |
  다음 useEffect의 cleanup 함수는 언제 실행돼?
code: |
  useEffect(() => {
    const id = setInterval(tick, 1000)
    return () => clearInterval(id)
  }, [tick])
choices:
  - "컴포넌트가 언마운트될 때만"
  - "매 렌더링이 끝난 직후 항상"
  - "절대 실행되지 않음 (effect는 한 번만 등록되므로)"
  - "`tick`이 바뀌면 다음 effect가 돌기 직전에, 그리고 컴포넌트 언마운트 시"
answer: 3
explanation: |
  cleanup은 "다음 effect가 시작되기 직전" + "컴포넌트가 언마운트될 때" 두 시점에 실행돼.
  의존성 배열의 `tick`이 새 참조가 되면, 이전 effect를 정리(cleanup)한 뒤에 새 effect를 다시 등록하는 식이야.
  그래서 setInterval 같은 리소스를 깔끔히 해제하지 않으면, 옛 타이머가 살아있는 채로 새 타이머도 등록돼서 누수가 나.
tags: [useEffect, cleanup, hooks]
