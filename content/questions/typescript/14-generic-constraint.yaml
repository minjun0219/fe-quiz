id: ts-014
category: typescript
difficulty: medium
type: single_choice
question: |
  다음 코드에서 (1)과 (2)의 결과로 가장 정확한 것은?
code: |
  function get<T, K extends keyof T>(obj: T, key: K): T[K] {
    return obj[key]
  }

  const u = { name: 'jun', age: 30 }
  const x = get(u, 'name')    // (1)
  const y = get(u, 'email')   // (2)
choices:
  - id: a
    text: (1) `string` 추론, (2)는 컴파일 에러 — `'email'`이 `keyof typeof u`에 없으므로
  - id: b
    text: 둘 다 `any`로 추론돼요
  - id: c
    text: (1) `unknown`, (2) `any`
  - id: d
    text: 둘 다 컴파일 에러 — `K extends keyof T`는 키를 좁히지 못해요
answer: a
explanation: |
  `K extends keyof T` 제약은 `K`가 `T`의 실제 키 중 하나임을 컴파일 타임에 강제해 주고, 동시에 리턴 타입 `T[K]`도 키에 따라 정확하게 추론돼요.
  그래서 `get(u, 'name')`은 `string`(`u.name`의 타입)으로 좁혀지고, `get(u, 'email')`은 `'email'`이 `keyof typeof u`( =`'name' | 'age'`)에 없어서 인자 단계에서 막혀요.
  런타임 안전한 접근 패턴에 광범위하게 쓰이는 형태예요.
references:
  - title: "TypeScript Handbook — Generics: Generic Constraints"
    url: "https://www.typescriptlang.org/docs/handbook/2/generics.html#generic-constraints"
  - title: "TypeScript Handbook — Generics: Using Type Parameters in Generic Constraints"
    url: "https://www.typescriptlang.org/docs/handbook/2/generics.html#using-type-parameters-in-generic-constraints"
tags: [ generics, constraints, keyof ]
