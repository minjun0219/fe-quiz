id: ts-004
category: typescript
difficulty: easy
type: single_choice
question: |
  `K`로 추론되는 타입은?
code: |
  type User = { id: number; name: string; email: string }
  type K = keyof User
choices:
  - id: a
    text: "`'id' | 'name' | 'email'`"
  - id: b
    text: "`number | string`"
  - id: c
    text: "`{ id: number; name: string; email: string }`"
  - id: d
    text: "`string`"
answer: a
explanation: |
  `keyof T`는 객체 타입 `T`의 **키 이름들의 union**을 만들어줘. 값 타입이 아니라 키 타입이라는 점이 핵심이야.
  `User['id']`처럼 인덱스 액세스 타입과 결합하면 "특정 키의 값 타입"을 꺼낼 수 있고, 이걸 매핑드 타입(`{ [K in keyof T]: ... }`)에서 자주 활용해.
  - b는 키의 **값** 타입 union이고 — 그건 `User[keyof User]`로 만들어.
  - d는 인덱스 시그니처가 `string`인 객체에 대해서만 그렇게 좁혀져.
tags: [ types, keyof, indexed-access ]
