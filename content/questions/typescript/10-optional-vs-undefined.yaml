id: ts-010
category: typescript
difficulty: easy
type: single_choice
question: |
  다음 코드에서 컴파일 에러가 나는 줄은? (`exactOptionalPropertyTypes`는 꿄 상태, strict이고 추가 옵션은 기본값)
code: |
  type A = { x?: number }
  type B = { x: number | undefined }

  const a: A = {}                  // (1)
  const b: B = {}                  // (2)
  const a2: A = { x: undefined }   // (3)
choices:
  - id: a
    text: 아무 줄도 에러가 나지 않는다
  - id: b
    text: (2)만 에러 — `B`는 `x` 키가 반드시 존재해야 하므로 `{}`에선 키 누락으로 오류
  - id: c
    text: (1)과 (2)둘 다 에러
  - id: d
    text: (3)만 에러
answer: b
explanation: |
  optional `?`는 "키 자체가 없어도 OK"를 의미해. 그래서 (1)의 `{}`은 `A`에 합치.
  반면 `{ x: number | undefined }`는 "키가 있으미 타입은 number·undefined"라 키 자체는 부일해서 (2)의 `{}`는 에러.
  (3) `{ x: undefined }`는 (`exactOptionalPropertyTypes` 플래그 OFF 기준) `A`에 허용돼. 해당 플래그를 켜면 (3)도 에러가 나서 "undefined 대입"과 "키 없음"을 엄격히 구분해.
tags: [ types, optional, undefined ]
