id: ts-008
category: typescript
difficulty: medium
type: multi_choice
question: |
  `readonly number[]` 타입에서 **컴파일 에러**가 나는 사용을 모두 골라봐.
code: |
  function takeReadonly(xs: readonly number[]) {
    // xs.???
  }
choices:
  - id: a
    text: "`xs.map(x => x * 2)`"
  - id: b
    text: "`xs.push(4)`"
  - id: c
    text: "`xs.length`"
  - id: d
    text: "`xs.sort()`"
  - id: e
    text: "`xs.slice(0, 2)`"
answer: [ b, d ]
explanation: |
  `readonly T[]` (또는 `ReadonlyArray<T>`)는 **변경 메서드만** 차단해.
  - `push`, `pop`, `shift`, `unshift`, `splice`, `sort`, `reverse`, `fill`, `copyWithin` → 원본을 변형하므로 차단.
  - `map`, `filter`, `slice`, `concat`, `length` 등 새 배열 반환·읽기 전용 접근은 모두 통과.
  주의: `sort`는 새 배열이 아니라 **원본을 정렬**하기 때문에 차단 대상. 정렬이 필요하면 `[...xs].sort()`처럼 사본을 만들어 정렬해.
tags: [ types, readonly, ReadonlyArray, mutation ]
