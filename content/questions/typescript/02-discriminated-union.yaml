id: ts-002
category: typescript
difficulty: medium
type: single_choice
question: |
  `area(shape)` 호출이 컴파일을 통과하고 모든 케이스에서 올바른 결과를 내려면, 어느 구현이 적절할까요?
code: |
  type Shape =
    | { kind: 'circle'; r: number }
    | { kind: 'square'; s: number }
choices:
  - id: a
    text: |
      ```ts
      function area(shape: Shape) {
        return Math.PI * shape.r ** 2
      }
      ```
  - id: b
    text: |
      ```ts
      function area(shape: Shape) {
        if (shape.kind === 'circle') return Math.PI * shape.r ** 2
        return shape.s ** 2
      }
      ```
  - id: c
    text: |
      ```ts
      function area(shape: Shape) {
        return shape.r ? Math.PI * shape.r ** 2 : shape.s ** 2
      }
      ```
  - id: d
    text: |
      ```ts
      function area(shape: Shape) {
        return (shape as any).r ? Math.PI * (shape as any).r ** 2 : (shape as any).s ** 2
      }
      ```
answer: b
explanation: |
  `kind` 같은 공통 리터럴 필드가 있는 union(=discriminated union)은 그 필드를 비교하면 컴파일러가 자동으로 분기 안에서 타입을 좁혀줘요.
  - a: `square` 분기에서 `r`이 없어서 컴파일 에러가 나요.
  - c: `shape.r` 직접 접근은 union 단계에서 차단돼요(둘 다 가지고 있는 게 아니거든요).
  - d: `as any`로 검사를 회피해요 — 런타임 동작은 우연히 맞지만 타입 안전성을 잃어요.
  - b: 정석이에요 — `kind` 좁히기로 양쪽 모두 안전하게 다룰 수 있어요.
references:
  - title: "TypeScript Handbook — Narrowing: Discriminated unions"
    url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#discriminated-unions"
  - title: "TypeScript Handbook — Everyday Types: Union Types"
    url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#union-types"
tags: [ types, discriminated-union, narrowing ]
