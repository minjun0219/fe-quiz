id: ts-020
category: typescript
difficulty: medium
type: single_choice
question: |
  아래 (A)와 (B) 방식의 차이로 가장 정확한 설명은?
code: |
  function isStr(v: unknown): v is string {
    return typeof v === 'string'
  }

  // (A)
  function lenA(v: unknown) {
    return (v as string).length
  }

  // (B)
  function lenB(v: unknown) {
    if (isStr(v)) return v.length
    return 0
  }
choices:
  - id: a
    text: 둘 다 동일한 안전성을 가져요
  - id: b
    text: |
      (A)는 컴파일러를 속이는 단언이라 컴파일은 통과하지만, 런타임에
      실제로 string이 아닌 값(예: `null`/`undefined`)이 들어오면
      `.length` 접근에서 그대로 깨져요. (B)는 `v is string` 술어를
      가진 타입 가드로 실제 검사 후에만 좁혀서 안전해요
  - id: c
    text: (A)는 컴파일 에러, (B)는 통과
  - id: d
    text: (B)는 `as`보다 성능이 느려서 비추돼요
answer: b
explanation: |
  `as`는 "내가 더 잘 알아"하고 컴파일러에게 대신 말해 주는 단언이라, 컴파일 단계에선 무조건 통과시켜 줘요. 그 대신 실제로 들어온 값이 단언과 다르면 그 값을 사용하는 코드(`.length`, `.map()` 등)에서 런타임 예외가 그대로 터져요.
  타입 가드 함수(`v is string`)는 **실제 검사 로직**과 **타입 좁힘 정보**를 한 곳에 묶어 둔 안전한 패턴이에요. 표준 라이브러리에도 `Array.isArray`(`arg is any[]`)처럼 타입 가드로 정의된 API가 있어요. (참고로 `Number.isFinite`는 그냥 `boolean`을 반환해서 타입 가드가 아니에요.)
  `as`는 외부 경계(JSON 파싱, 타사 API)에서 "이미 검증되었음"이 분명한 경우에만 조심스럽게 쓰는 게 좋아요.
  (출처: https://github.com/microsoft/TypeScript/blob/main/src/lib/es5.d.ts, https://github.com/microsoft/TypeScript/blob/main/src/lib/es2015.core.d.ts)
references:
  - title: "TypeScript Handbook — Narrowing: Using type predicates"
    url: "https://www.typescriptlang.org/docs/handbook/2/narrowing.html#using-type-predicates"
  - title: "TypeScript Handbook — Everyday Types: Type Assertions"
    url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-assertions"
tags: [ type-guard, as, narrowing ]
