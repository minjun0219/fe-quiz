id: ts-011
category: typescript
difficulty: easy
type: single_choice
question: |
  아래 `Palette` 타입을 만족하는 값으로 `???` 자리에 들어갈 수 있는 것은?
code: |
  type Theme = 'light' | 'dark'
  type Palette = Record<Theme, { bg: string }>

  const p: Palette = {
    light: { bg: 'white' },
    /* ??? */
  }
choices:
  - id: a
    text: "`dark: { bg: 'black' }` — `Record<Theme, ...>`는 `Theme`의 모든 키(`'light' | 'dark'`)에 값이 있어야 함을 강제해요"
  - id: b
    text: "아무 것도 안 써도 통과해요 — Record는 키를 옵셔널로 취급해요"
  - id: c
    text: "`[key: string]: any` — 인덱스 시그니처를 추가해야 해요"
  - id: d
    text: "`dark?: ...` — Record는 부분 객체를 자동 허용해요"
answer: a
explanation: |
  `Record<K, V>`는 "`K`의 모든 매칭 키에 대해 `V` 값을 가진 객체"의 단축 표기라, `Theme`가 유니온 리터럴이면 그 안의 모든 값이 키로 필수가 돼요.
  키를 부분적으로만 원하면 `Partial<Record<Theme, V>>`처럼 따로 감싸야 해요. `Record<string, V>`처럼 K가 `string`이면 인덱스 시그니처와 유사한 의미예요.
  업무에선 enum 같은 고정 키 세트에 일괄적인 값을 매핑할 때 유용하고, "누락 없는 매핑"을 컴파일 타임에 강제해 줘요.
references:
  - title: "TypeScript Handbook — Utility Types: Record<Keys, Type>"
    url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#recordkeys-type"
  - title: "TypeScript Handbook — Utility Types: Partial<Type>"
    url: "https://www.typescriptlang.org/docs/handbook/utility-types.html#partialtype"
tags: [ utility-types, record, mapping ]
