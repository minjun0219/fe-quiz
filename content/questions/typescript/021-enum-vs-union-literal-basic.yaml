id: ts-021
category: typescript
difficulty: easy
type: single_choice
question: 아래 코드에서 변수 `dir`에 할당할 수 있는 값을 가장 정확하게 설명한 것은?
code: |-
  type Direction = 'up' | 'down' | 'left' | 'right'

  let dir: Direction = 'up'
choices:
  - id: a
    text: 임의의 `string` 값을 모두 할당할 수 있어요.
  - id: b
    text: "`'up'`, `'down'`, `'left'`, `'right'` 네 개의 문자열 리터럴만 할당할 수 있어요."
  - id: c
    text: "대소문자에 관계없이 네 단어 중 하나면 모두 허용돼요. 예: `'UP'`도 가능."
  - id: d
    text: 런타임에는 어떤 값이든 할당되지만, 컴파일 시점에는 `number` 타입만 허용돼요.
answer: b
explanation: "`'up' | 'down' | 'left' | 'right'`는 문자열 리터럴 타입의 유니온(union)이에요. 각 멤버는 정확히 그 문자열만을 의미하기 때문에 `dir`에는 이 네 가지 리터럴 값만 할당할 수 있어요. `'UP'`이나 `'forward'` 같은 다른 문자열을 넣으면 **컴파일 에러**가 나요. 일반 `string`을 다 받아들이려면 타입을 `string`으로 선언해야 해요."
references:
  - title: TypeScript Handbook — Literal Types
    url: https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#literal-types
  - title: TypeScript Handbook — Union Types
    url: https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#union-types
tags:
  - types
  - literal-types
  - union
  - string-literal
