id: ts-018
category: typescript
difficulty: medium
type: single_choice
question: |
  다음 코드에서 타입 `H`로 추론되는 값은?
code: |
  type EvtName = 'click' | 'hover'
  type Handler<E extends string> = `on${Capitalize<E>}`
  type H = Handler<EvtName>
choices:
  - id: a
    text: "`'click' | 'hover'`"
  - id: b
    text: "`'onclick' | 'onhover'`"
  - id: c
    text: "`'onClick' | 'onHover'`"
  - id: d
    text: "`string`"
answer: c
explanation: |
  템플릿 리터럴 타입은 리터럴 타입 조각을 이어 붙여 새 리터럴 유니온을 만들어 줘요. `Capitalize<E>`는 유니온 구성원 각각을 대문자로 바꿔 `'Click' | 'Hover'`로 자라나고, `"on"`과 결합해서 `'onClick' | 'onHover'`가 돼요.
  이벤트 핸들러/CSS 프로퍼티명 같은 패턴의 타입을 자동으로 만들 때 유용해요. `Uppercase`, `Lowercase`, `Uncapitalize`도 함께 기억해 두면 좋아요.
references:
  - title: "TypeScript Handbook — Template Literal Types"
    url: "https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html"
  - title: "TypeScript Handbook — Template Literal Types: Intrinsic String Manipulation Types"
    url: "https://www.typescriptlang.org/docs/handbook/2/template-literal-types.html#intrinsic-string-manipulation-types"
tags: [ template-literal-type, capitalize ]
