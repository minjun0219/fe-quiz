id: html-009
category: html
difficulty: easy
type: multi_choice
question: |
  `<img alt>` 작성 원칙으로 **맞는 것**을 모두 골라 보세요.
choices:
  - id: a
    text: |
      의미 있는 콘텐츠를 가진 이미지에는 그 의미를 짧고 구체적으로
      적어요 (예: "확인 아이콘"보다 "결제 완료")
  - id: b
    text: 순수 장식용 이미지엔 `alt=""`로 빈 값을 주어 스크린리더가 건너뛰게 해요
  - id: c
    text: 이미지에 텍스트가 들어 있다면 그 텍스트를 그대로 포함시키되 시각 정보를 보충해요
  - id: d
    text: 모든 이미지에 "image of" 또는 "사진" 같은 접두어를 붙이는 게 좋아요
  - id: e
    text: 옆 캡션이 같은 내용을 이미 전달한다면 `alt=""`로 두어 중복 낭독을 막을 수 있어요
answer: [ a, b, c, e ]
explanation: |
  - a: alt는 시각 정보를 "의미"로 옮기는 자리예요. 같은 결과를 짧게 전달하는 문장이 핵심이에요.
  - b: 의미 없는 장식 이미지는 비워 두는 편이 스크린리더 노이즈를 줄여 줘요.
  - c: 이미지 안에 텍스트가 있다면 그 텍스트를 alt에 옮겨야 누락이 없어요.
  - d: 스크린리더가 이미 "이미지"라는 역할을 알려 주기 때문에 "사진", "image of" 같은 접두어는 중복 낭독이 돼서 권장하지 않아요.
  - e: 캡션 같은 텍스트가 같은 정보를 전달하면 alt=""로 두는 편이 자연스러워요.
references:
  - title: "MDN — <img> alt attribute"
    url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Element/img#alt"
  - title: "W3C — An alt Decision Tree"
    url: "https://www.w3.org/WAI/tutorials/images/decision-tree/"
tags: [ a11y, alt, semantics ]
