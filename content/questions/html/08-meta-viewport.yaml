id: html-008
category: html
difficulty: medium
type: single_choice
question: |
  반응형 페이지의 `<head>`에 들어가야 할 viewport 메타 태그로 가장 적절한 것은?
choices:
  - id: a
    text: |
      <meta name="viewport" content="width=1024" />
  - id: b
    text: |
      <meta name="viewport" content="width=device-width, initial-scale=1" />
  - id: c
    text: |
      <meta name="viewport" content="user-scalable=no" />
  - id: d
    text: |
      viewport 메타는 데스크톱 전용이라 모바일 페이지엔 넣지 않는 게 맞음
answer: b
explanation: |
  `width=device-width`는 가상 뷰포트 너비를 **디바이스의 CSS 픽셀 너비**에 맞추라는 뜻 — 미디어 쿼리(`@media (max-width: ...)`)가 의도한 대로 동작하기 위한 전제야.
  `initial-scale=1`은 처음 로드 시 1배율(=논리 픽셀:CSS 픽셀 1:1)로 보여주라는 뜻. 둘이 합쳐져야 모바일 브라우저가 데스크톱 기준 980px로 가정하지 않고 실제 디바이스 너비로 렌더링해.
  - a: 너비를 1024로 고정하면 작은 화면에서 가로 스크롤 발생.
  - c: `user-scalable=no`는 사용자 핀치 줌을 막아 접근성에 해롭고 대부분의 신규 페이지에서 권장하지 않음.
  - d: 메타 태그가 없으면 모바일 브라우저가 기본값(보통 980px)으로 렌더해 레이아웃이 깨짐.
tags: [ viewport, meta, responsive, mobile ]
