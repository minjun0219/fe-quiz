id: html-019
category: html
difficulty: hard
type: single_choice
question: |
  다음 두 iframe 설정의 의미와 두 번째 설정의 위험으로 가장 정확한 것은?
code: |
  <iframe src="ad.html" sandbox></iframe>
  <iframe src="x.html"
          sandbox="allow-scripts allow-same-origin">
  </iframe>
choices:
  - id: a
    text: 첫 번째는 모든 능력을 차단(스크립트·폼·팝업 등 전부 안 됨), 두 번째는 스크립트와 same-origin 자격을 둘 다 허용해 iframe이 부모 origin의 쿠키/스토리지에 접근하면서 임의 스크립트를 실행할 수 있어 사실상 sandbox를 무력화해요
  - id: b
    text: 두 번째는 보안 강도를 더 높인 설정이라 권장돼요
  - id: c
    text: "`sandbox` 속성 없이도 같은 결과예요"
  - id: d
    text: "`allow-scripts`만 있으면 안전하지 않으므로 `allow-same-origin`을 추가해야 해요"
answer: a
explanation: |
  빈 `sandbox` 속성은 iframe의 모든 능력을 제한하는 최대 보수적 설정이에요. 스크립트 실행·폼 제출·팝업·동일 출처 접근·top-level 네비게이션 등이 모두 막혀요.
  `allow-scripts allow-same-origin`을 함께 주면, iframe이 자신의 실제 출처(고유 opaque origin 대신 `src`의 origin)로 취급되면서 스크립트를 실행할 수 있어요. iframe 콘텐츠가 부모와 같은 origin에서 서빙된다면 부모의 쿠키/로컬스토리지·DOM에 접근할 수 있고, 더 결정적인 문제는 iframe 안 스크립트가 부모 쪽 `<iframe>` 엘리먼트의 `sandbox` 속성을 제거한 뒤 다시 로드/네비게이션 시키면 그 시점부터 모든 제한이 풀려버린다는 거예요(`sandbox` 는 document 생성 시점에만 평가되므로) — 사실상 sandbox가 없는 것과 다름없어요.
  제삼자 콘텐츠를 실으려면 `allow-scripts`는 쓰되 `allow-same-origin`을 함께 주지 않는 게 기본 원칙이에요.
references:
  - title: "MDN — <iframe> sandbox attribute"
    url: "https://developer.mozilla.org/ko/docs/Web/HTML/Element/iframe#sandbox"
  - title: "HTML Standard — Sandboxing"
    url: "https://html.spec.whatwg.org/multipage/iframe-embed-object.html#attr-iframe-sandbox"
tags: [ iframe, sandbox, security ]
