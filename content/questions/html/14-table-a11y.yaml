id: html-014
category: html
difficulty: medium
type: single_choice
question: |
  다음 표 마크업에서 `<caption>`과 `scope` 속성의 역할로 가장 정확한 것은?
code: |
  <table>
    <caption>2025 매출</caption>
    <thead>
      <tr><th scope="col">분기</th><th scope="col">금액</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">Q1</th><td>10억</td></tr>
    </tbody>
  </table>
choices:
  - id: a
    text: 시각용 장식이며 스크린리더 동작에는 영향이 없다
  - id: b
    text: "`<caption>`은 표의 제목/요약을 스크린리더가 표 진입 시 알려 주고, `scope=\"col\"`/`\"row\"`은 각 셀이 어느 행/열의 헤더인지 명시해 데이터 셀을 읽을 때 헤더를 함께 읽어 주도록 한다"
  - id: c
    text: "`<caption>`은 항상 첫 번째 자식이어야 하며 그 외 동작 차이는 없다"
  - id: d
    text: "`scope` 없이는 `<th>`가 동작하지 않는다"
answer: b
explanation: |
  표는 단순히 이차원 그리드가 아니라 "헤더-데이터" 관계를 가진 구조라, 그 관계를 마크업으로 알려 줘야 스크린리더가 셀을 읽을 때 어떤 분기·항목인지 함께 안내해 줘.
  `<caption>`은 표 전체에 대한 짧은 제목/요약을 제공해서 사용자가 표에 진입할 때 컨텍스트를 잡게 해 주고, `scope`은 각 `<th>`가 행 헤더인지 열 헤더인지 명시해 데이터 셀 낭독 시 그 헤더가 같이 읽혀.
  복잡한 표라면 `headers` 속성으로 셀과 헤더를 명시적으로 연결하는 패턴도 있어.
tags: [ a11y, table, semantics ]
