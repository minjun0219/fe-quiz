id: html-004
category: html
difficulty: medium
type: single_choice
question: |
  사용자가 "취소" 버튼을 클릭하면 어떻게 동작할까요?
code: |
  <form action="/save" method="post">
    <input name="title" />
    <button>저장</button>
    <button onclick="closeModal()">취소</button>
  </form>
choices:
  - id: a
    text: |
      closeModal()만 실행되고 폼은 전송되지 않아요
  - id: b
    text: |
      closeModal()이 실행된 뒤, 폼이 /save로 POST 전송돼요
  - id: c
    text: |
      closeModal()이 무시되고 폼만 전송돼요
  - id: d
    text: |
      "취소"는 type 미지정이라 아무 동작도 안 해요
answer: b
explanation: |
  `<form>` 안의 `<button>`은 **`type` 속성을 생략하면 기본값이 `submit`** 이에요.
  그래서 "취소" 버튼도 onclick으로 closeModal() 실행 후, 기본 동작인 폼 전송이 그대로 일어나 `/save`로 POST가 날아가요.
  의도한 대로 닫기만 하려면 `<button type="button" onclick="closeModal()">취소</button>`로 명시하거나, 핸들러에서 `event.preventDefault()`를 호출해요.
  실수로 폼이 전송되는 흔한 버그예요 — 폼 안의 모든 비-submit 버튼에는 `type="button"`을 붙이는 습관이 안전해요.
references:
  - title: "MDN — <button> type attribute"
    url: "https://developer.mozilla.org/ko/docs/Web/HTML/Element/button#type"
  - title: "MDN — <form>: Implicit submission"
    url: "https://developer.mozilla.org/ko/docs/Web/HTML/Element/form"
tags: [ forms, button, submit, gotcha ]
