id: html-010
category: html
difficulty: easy
type: single_choice
question: |
  다음 마크업의 동작 설명으로 가장 정확한 것은?
code: |
  <details>
    <summary>FAQ</summary>
    내용...
  </details>
choices:
  - id: a
    text: JS 없이도 클릭/Enter로 펼침·접힘이 토글되며, 첫 자식이 `<summary>`라면 그 텍스트가 토글 라벨이 돼요. 기본 닫힘 상태이며 `open` 속성으로 펼친 상태로 시작할 수 있어요
  - id: b
    text: "`<details>`는 표시만 담당하고 토글 동작은 별도 JS가 필요해요"
  - id: c
    text: "`<summary>`는 화면에 보이지 않고 a11y 트리에만 노출돼요"
  - id: d
    text: "`<details open>`을 쓰면 모든 형제 details가 함께 열려요"
answer: a
explanation: |
  `<details>`/`<summary>`는 브라우저가 토글 동작을 기본 제공하는 disclosure 위젯이라 JS가 필요 없어요. 시각/스크린리더 모두 "펼쳐짐/접힘" 상태를 알려 줘서 a11y 측면에서도 접근하기 좋아요.
  처음부터 펼쳐 두려면 `<details open>`처럼 `open` 속성을 추가하면 되고, 기본적으로는 다른 details와 자동으로 연동되진 않아요. 다만 여러 details에 같은 `name` 값을 주면 아코디언처럼 한 번에 하나만 열리게 JS 없이도 묶을 수 있어요(Baseline 지원).
  (출처: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/details)
references:
  - title: "MDN — <details>: The Details disclosure element"
    url: "https://developer.mozilla.org/ko/docs/Web/HTML/Element/details"
  - title: "MDN — <summary>: The Disclosure Summary element"
    url: "https://developer.mozilla.org/ko/docs/Web/HTML/Element/summary"
tags: [ details, summary, disclosure ]
