id: html-001
category: html
difficulty: easy
type: multi_choice
question: |
  같은 클릭 처리를 한다고 가정할 때, `<div onclick>` 대신 `<button>`을 써야 하는 이유로 **맞는 것**을 모두 골라 보세요.
code: |
  <div onclick="handle()">저장</div>
  <button onclick="handle()">저장</button>
choices:
  - id: a
    text: 키보드 Enter/Space로도 활성화돼 키보드 사용자가 쓸 수 있어요
  - id: b
    text: 스크린 리더가 "버튼"이라는 역할을 알려 줘서 보조 기술 호환성이 좋아요
  - id: c
    text: Tab 키로 자연스럽게 포커스 이동돼요 (tabindex 없이도)
  - id: d
    text: "`<div>`보다 항상 클릭 이벤트가 더 빠르게 처리돼요"
  - id: e
    text: 폼 안에서 자동으로 submit/reset 같은 기본 동작을 가져요
answer: [ a, b, c, e ]
explanation: |
  - a, b, c: `<button>`은 기본적으로 키보드 활성화·포커스·"button" 역할을 모두 가져요. `<div>`로 흉내 내려면 `role`, `tabindex`, 키보드 핸들러까지 직접 달아야 해요.
  - e: `<form>` 안의 `<button>`은 기본 `type="submit"`이라 폼 전송이 트리거돼요. 막으려면 명시적으로 `type="button"`을 줘야 해요.
  - d: 잘못된 선택지예요 — 클릭 처리 속도는 둘이 사실상 차이가 없어요. 의미·접근성이 차이의 본질이에요.
  결론: 기본 동작·접근성을 공짜로 얻으려면 의미에 맞는 태그를 골라야 해요.
references:
  - title: "MDN — <button>: The Button element"
    url: "https://developer.mozilla.org/ko/docs/Web/HTML/Element/button"
  - title: "ARIA Authoring Practices Guide — Button Pattern"
    url: "https://www.w3.org/WAI/ARIA/apg/patterns/button/"
tags: [ semantics, a11y, button, forms ]
