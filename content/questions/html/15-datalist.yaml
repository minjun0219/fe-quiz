id: html-015
category: html
difficulty: medium
type: single_choice
question: |
  `<datalist>`가 `<select>`와 다른 점으로 가장 정확한 것은?
code: |
  <input list="cities" name="city">
  <datalist id="cities">
    <option value="Seoul"></option>
    <option value="Busan"></option>
  </datalist>
choices:
  - id: a
    text: "`<select>`는 보기 중 하나만 고를 수 있는 드롭다운, `<datalist>`는 자유 텍스트 입력에 자동완성 후보 목록을 제안하는 보조 위젯이라 목록 외 값도 자유롭게 입력할 수 있어요"
  - id: b
    text: 둘은 완전히 동일하게 동작해요
  - id: c
    text: "`<datalist>`는 항상 다중 선택이 가능해요"
  - id: d
    text: "`<datalist>`는 라디오 버튼 그룹의 별칭이에요"
answer: a
explanation: |
  `<datalist>`는 input에 "추천 후보"를 제공하는 보조일 뿐이라 사용자가 목록에 없는 값도 그대로 적어 넣을 수 있어요. "몇 자만 입력하면 후보를 보여주고 그 외의 임의 값도 허용"하는 UX에 강점이 있어요.
  반대로 도메인이 좁고 고정된 보기에서 하나를 고르게 하는 경우는 `<select>`가 더 적합해요. 접근성 측면에서도 datalist는 브라우저별 구현 차이가 있어 보조적 수단으로 생각하는 게 안전해요.
references:
  - title: "MDN — <datalist>: The HTML Data List element"
    url: "https://developer.mozilla.org/ko/docs/Web/HTML/Element/datalist"
  - title: "MDN — <select>: The HTML Select element"
    url: "https://developer.mozilla.org/ko/docs/Web/HTML/Element/select"
