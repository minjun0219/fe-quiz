id: html-015
category: html
difficulty: medium
type: single_choice
question: |
  `<datalist>`가 `<select>`와 다른 점으로 가장 정확한 것은?
code: |
  <input list="cities" name="city">
  <datalist id="cities">
    <option value="Seoul"></option>
    <option value="Busan"></option>
  </datalist>
choices:
  - id: a
    text: "`<select>`는 보기 중 하나만 고를 수 있는 드롭다운, `<datalist>`는 자유 텍스트 입력에 자동완성 후보 목록을 제안하는 보조 위젯이라 목록 외 값도 자유롭게 입력 가능하다"
  - id: b
    text: 둘은 완전히 동일하게 동작한다
  - id: c
    text: "`<datalist>`는 항상 다중 선택이 가능하다"
  - id: d
    text: "`<datalist>`는 라디오 버튼 그룹의 별칭이다"
answer: a
explanation: |
  `<datalist>`는 input에 "추천 후보"를 제공하는 보조일 뿐이라 사용자가 목록에 없는 값도 그대로 쪼 넣을 수 있어. "몇 자철 입력하면 후보를 보여주고 그외에 임의 값도 허용"하는 UX에 있어.
  반대로 도메인이 좀은 고정된 보기에서 하나를 고르게하는 경우는 `<select>`가 더 적합해. 접근성 측면에서도 datalist는 브라우저별 구현 차이가 있어 보조적 수단으로 생각하는 게 안전해.
tags: [ form, autocomplete, datalist ]
