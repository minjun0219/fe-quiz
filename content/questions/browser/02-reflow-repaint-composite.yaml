id: browser-002
category: browser
difficulty: medium
type: single_choice
question: |
  다음 중 레이아웃 재계산을 피하고 대체로 Composite 단계에서 처리되어 애니메이션에 유리한 CSS 속성 조합은?
choices:
  - id: a
    text: '`top`, `left`'
  - id: b
    text: '`width`, `height`'
  - id: c
    text: '`transform`, `opacity`'
  - id: d
    text: '`margin`, `padding`'
answer: c
explanation: |
  `transform`과 `opacity`는 요소의 실제 문서 흐름을 바꾸지 않고 시각적 결과만 바꾸는 경우가 많아서, 브라우저가 Layout/Reflow를 다시 계산하지 않고 Composite 단계에서 처리할 수 있어요.
  반대로 `top`, `left`, `width`, `height`, `margin`, `padding`은 요소의 크기나 위치 계산에 영향을 줘 주변 요소까지 다시 배치해야 할 수 있습니다. 그래서 스크롤·드래그·hover처럼 자주 변하는 애니메이션에는 `transform` 기반 이동이 보통 더 안전해요.
tags: [ rendering, reflow, repaint, composite, css ]
