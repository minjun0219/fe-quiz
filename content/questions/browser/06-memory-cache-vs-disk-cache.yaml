id: browser-006
category: browser
difficulty: easy
type: single_choice
question: |
  브라우저의 메모리 캐시와 디스크 캐시에 대한 설명으로 가장 적절한 것은?
choices:
  - id: a
    text: "메모리 캐시는 RAM에 저장되어 빠르지만 오래 유지되기 어렵고, 디스크 캐시는 저장장치에 남아 재방문 시 재사용되기 쉬워요."
  - id: b
    text: "메모리 캐시는 브라우저를 껐다 켜도 항상 유지되고, 디스크 캐시는 탭을 닫으면 즉시 사라져요."
  - id: c
    text: "디스크 캐시는 네트워크보다 항상 느리므로 브라우저는 정적 리소스를 절대 저장하지 않아요."
  - id: d
    text: "두 캐시는 저장 위치만 다르고 속도, 생명주기, 재사용 상황에는 차이가 없어요."
answer: a
explanation: |
  메모리 캐시는 RAM에 리소스를 보관하므로 접근이 빠르고, 현재 페이지나 탭에서 곧 다시 사용할 CSS·JS 같은 리소스에 유리해요. 다만 메모리에 있기 때문에 브라우저나 탭의 생명주기, 메모리 압박에 따라 오래 유지되지 않을 수 있어요.
  디스크 캐시는 SSD나 HDD 같은 저장장치에 리소스를 보관해서 브라우저를 다시 열거나 사이트를 재방문할 때도 재사용될 가능성이 높아요. 접근 속도는 메모리보다 느릴 수 있지만, 이미지·폰트처럼 반복해서 쓰이는 정적 리소스를 다시 다운로드하지 않게 해 로딩 비용을 줄여요.
  오답 b는 두 캐시의 생명주기를 반대로 설명했고, c는 디스크 캐시의 목적을 부정해서 틀렸어요. d처럼 단순 저장 위치 차이만 있는 것이 아니라 속도와 유지 기간, 브라우저가 선택하는 재사용 전략까지 달라요.
tags: [ cache, memory-cache, disk-cache, browser ]
