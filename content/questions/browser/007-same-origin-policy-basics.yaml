id: browser-007
category: browser
difficulty: easy
type: single_choice
question: 브라우저의 동일 출처 정책(Same-Origin Policy)에서 '같은 출처(origin)'를 구성하는 요소로 가장 알맞은 것은 무엇인가요?
choices:
  - id: a
    text: 도메인(host)만 같으면 동일 출처로 간주해요.
  - id: b
    text: 스킴(scheme), 호스트(host), 포트(port) 세 가지가 모두 같아야 동일 출처예요.
  - id: c
    text: 스킴과 호스트만 같으면 포트가 달라도 동일 출처예요.
  - id: d
    text: 경로(path)까지 일치해야 동일 출처로 인정돼요.
answer: b
explanation: 동일 출처 정책에서 출처(origin)는 **스킴 + 호스트 + 포트**의 튜플로 정의돼요. 예를 들어 `https://example.com`과 `http://example.com`은 스킴이 달라서 다른 출처이고, `https://example.com`과 `https://example.com:8443`은 포트가 달라 다른 출처예요. 경로(path)나 쿼리는 출처 판별에 들어가지 않아요.
references:
