id: browser-007
category: browser
difficulty: easy
type: single_choice
question: 브라우저의 동일 출처 정책(Same-Origin Policy)에서 두 URL이 **같은 출처**로 간주되려면 무엇이 모두 일치해야 할까요?
choices:
  - id: a
    text: 스킴(scheme), 호스트(host), 포트(port)가 모두 같아야 해요
  - id: b
    text: 호스트(host)만 같으면 같은 출처로 간주돼요
  - id: c
    text: 스킴과 호스트만 같으면 포트가 달라도 같은 출처예요
  - id: d
    text: 도메인의 최상위(TLD)와 경로(path)가 같으면 같은 출처예요
answer: a
explanation: 출처(origin)는 `scheme + host + port`의 튜플로 정의돼요. 예를 들어 `https://example.com`과 `http://example.com`은 스킴이 다르고, `https://example.com:443`과 `https://example.com:8443`은 포트가 다르므로 서로 다른 출처예요. 경로(path)나 쿼리(query)는 출처 판정과 무관해요. 같은 출처가 아니면 기본적으로 다른 출처의 `Document`·스토리지·자바스크립트 API 접근이 차단되고, fetch 응답 본문도 CORS 헤더 없이는 읽을 수 없어요.
