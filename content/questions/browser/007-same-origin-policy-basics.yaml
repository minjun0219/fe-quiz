id: browser-007
category: browser
difficulty: easy
type: single_choice
question: 브라우저의 동일 출처 정책(Same-Origin Policy)에서 '같은 출처'로 판정되는 기준으로 가장 알맞은 것은?
choices:
  - id: a
    text: 도메인(host)만 같으면 같은 출처예요.
  - id: b
    text: 스킴(scheme), 호스트(host), 포트(port)가 모두 같아야 같은 출처예요.
  - id: c
    text: 최상위 도메인(eTLD+1)이 같으면 포트나 스킴이 달라도 같은 출처예요.
  - id: d
    text: 경로(path)까지 동일해야 같은 출처로 인정돼요.
answer: b
explanation: "동일 출처 정책에서 '출처(origin)'는 **스킴 + 호스트 + 포트**의 3-튜플로 정의돼요. 예를 들어 `https://example.com` 과 `http://example.com` 은 스킴이 달라서 다른 출처, `https://example.com:443` 과 `https://example.com:8443` 은 포트가 달라서 다른 출처예요. 경로(path)는 출처 비교에 들어가지 않고, eTLD+1 비교는 'site' 개념(예: SameSite 쿠키)에서 쓰여요."
references:
