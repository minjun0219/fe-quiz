id: browser-005
category: browser
difficulty: hard
type: single_choice
question: |
  브라우저 이벤트 루프에서 렌더링과 가장 가까운 설명은?
choices:
  - id: a
    text: 매 Task가 끝나면 Microtask를 비운 뒤 브라우저가 필요하면 렌더링 단계를 수행해요.
  - id: b
    text: Microtask는 렌더링보다 항상 뒤에 실행돼요.
  - id: c
    text: '`requestAnimationFrame` 콜백은 Paint가 끝난 뒤 다음 Task로 실행돼요.'
  - id: d
    text: 긴 Task는 렌더링과 무관해서 프레임 드랍을 만들지 않아요.
answer: a
explanation: |
  브라우저 이벤트 루프는 Task 하나를 처리한 뒤 Promise callback 같은 Microtask queue를 비우고, 렌더링이 필요하면 스타일 계산·Layout·Paint 같은 화면 갱신 단계를 수행해요.
  그래서 Microtask가 너무 많이 쌓이거나 하나의 Task가 오래 실행되면 브라우저가 렌더링할 틈을 얻지 못해 프레임 드랍이 생길 수 있어요. `requestAnimationFrame`은 다음 Paint 직전에 실행되므로 애니메이션 상태를 갱신하기 좋은 타이밍을 제공해요.
tags: [ event-loop, rendering, microtask, requestAnimationFrame ]
