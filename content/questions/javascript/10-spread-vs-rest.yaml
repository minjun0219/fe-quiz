id: js-010
category: javascript
difficulty: medium
type: single_choice
question: |
  다음 코드의 출력은?
code: |
  const a = { user: { name: '하늘' }, version: 1 }
  const b = { ...a, version: 2 }
  b.user.name = '바다'
  console.log(a.user.name, '/', a.version)
choices:
  - id: a
    text: 하늘 / 1
  - id: b
    text: 바다 / 2
  - id: c
    text: 바다 / 1
  - id: d
    text: 하늘 / 2
answer: c
explanation: |
  스프레드는 **얕은 복사**야. `b`는 `a`의 최상위 프로퍼티만 새로 복사하고, 안쪽 객체(`user`)는 참조를 그대로 공유해.
  그래서 `b.user.name = '바다'`로 바꾸면 `a.user`도 같은 객체라 같이 바뀌어 → `a.user.name`은 `'바다'`.
  반면 `version`은 원시값이고 b에서 덮어썼지만, a는 자기 값(1) 그대로 → `a.version`은 `1`.
  깊은 복사가 필요하면 `structuredClone(a)` 같은 걸 써야 해.
tags: [ spread, shallow-copy, immutability ]
