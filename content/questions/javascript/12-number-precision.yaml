id: js-012
category: javascript
difficulty: easy
type: multiple_choice
question: |
  자바스크립트에서 `0.1 + 0.2 === 0.3` 평가 결과와 그 이유로 알맞은 것은?
choices:
  - "true — IEEE 754 double은 모든 십진 소수를 정확히 표현해."
  - "false — 0.1과 0.2가 이진 부동소수점에서 무한 반복 비트로 표현돼 합이 0.30000000000000004가 돼."
  - "true — 비교 시 자동으로 반올림돼 같다고 판정해."
  - "false — `===`가 같은 타입의 숫자도 항상 별개의 객체로 비교하기 때문이야."
answer: 1
explanation: |
  자바스크립트의 `number`는 IEEE 754 64bit double이라 0.1, 0.2처럼 십진수에서 깔끔한 소수가 이진 부동소수점에선 무한 반복돼서 정확히 표현 안 돼. 그 결과 합이 `0.30000000000000004`가 되고 `=== 0.3`은 false야.
  실무에서는 `Math.abs(a - b) < Number.EPSILON`으로 근사 비교하거나, 금액처럼 정밀도가 중요한 값은 정수 단위(원/센트)로 다루는 게 안전해.
tags: [number, ieee754, precision]
