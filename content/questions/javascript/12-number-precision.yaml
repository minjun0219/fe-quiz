id: js-012
category: javascript
difficulty: easy
type: single_choice
question: |
  자바스크립트에서 `0.1 + 0.2 === 0.3` 평가 결과와 그 이유로 알맞은 것은?
choices:
  - id: a
    text: true — IEEE 754 double은 모든 십진 소수를 정확히 표현해요.
  - id: b
    text: false — 0.1과 0.2가 이진 부동소수점에서 무한 반복 비트로 표현돼 합이 0.30000000000000004가 돼요.
  - id: c
    text: true — 비교 시 자동으로 반올림돼 같다고 판정해요.
  - id: d
    text: false — `===`가 같은 타입의 숫자도 항상 별개의 객체로 비교하기 때문이에요.
answer: b
explanation: |
  자바스크립트의 `number`는 IEEE 754 64bit double이라 0.1, 0.2처럼 십진수에서 깔끔한 소수가 이진 부동소수점에선 무한 반복돼서 정확히 표현 안 돼요. 그 결과 합이 `0.30000000000000004`가 되고 `=== 0.3`은 false예요.
  실무에서는 `Math.abs(a - b) < 허용오차`로 근사 비교하는데, `Number.EPSILON`을 그대로 임계값으로 쓰는 건 크기가 1 근처인 수에서만 유효해요 — 수가 커지면 비교하는 값의 크기에 맞게 허용오차를 키워야 해요. 금액처럼 정밀도가 중요한 값은 정수 단위(원/센트)로 다루는 게 안전해요.
  (출처: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/EPSILON)
tags: [ number, ieee754, precision ]
