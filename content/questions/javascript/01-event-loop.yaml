id: js-001
category: javascript
difficulty: medium
type: single_choice
question: |
  다음 코드의 출력 순서는?
code: |
  console.log(1)
  setTimeout(() => console.log(2))
  Promise.resolve().then(() => console.log(3))
  console.log(4)
choices:
  - id: a
    text: 1, 2, 3, 4
  - id: b
    text: 1, 4, 3, 2
  - id: c
    text: 1, 4, 2, 3
  - id: d
    text: 1, 3, 4, 2
answer: b
explanation: |
  동기 코드(1, 4)가 먼저 → 마이크로태스크(`Promise.then`의 3) → 매크로태스크(`setTimeout`의 2) 순서로 실행돼요.
  마이크로태스크 큐는 매크로태스크 하나 처리 사이마다 전부 비워지기 때문에, `setTimeout`보다 `Promise.then`이 항상 먼저 도착해요.
tags: [ event-loop, async, microtask ]
