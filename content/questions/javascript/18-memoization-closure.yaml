id: js-018
category: javascript
difficulty: medium
type: single_choice
question: |
  다음 `memoize`로 감싼 함수가 5번 호출됐을 때 `calls`의 최종 값은?
code: |
  function memoize(fn) {
    const cache = new Map()
    return (n) => {
      if (cache.has(n)) return cache.get(n)
      const r = fn(n)
      cache.set(n, r)
      return r
    }
  }
  let calls = 0
  const square = memoize((n) => { calls++; return n * n })
  square(2); square(3); square(2); square(3); square(2)
  console.log(calls)
choices:
  - id: a
    text: "5 — 매 호출마다 원본 함수가 새로 실행돼요"
  - id: b
    text: "2 — `2`와 `3` 각 첫 호출에서만 원본을 실행하고 나머지 3번은 캐시 히트예요"
  - id: c
    text: "3 — 마지막 호출 시 캐시가 초기화돼 다시 실행돼요"
  - id: d
    text: "0 — `cache.has(n)` 검사가 항상 true라 원본이 호출되지 않아요"
answer: b
explanation: |
  `memoize`가 클로저로 잡은 `cache`가 호출 사이에 살아남기 때문에, 같은 인자(`2`, `3`)에 대한 두 번째부터의 호출은 `cache.has`가 true가 돼 원본 함수가 실행되지 않아요.
  결과적으로 `calls`는 처음 `square(2)`와 `square(3)`에서만 증가해 2가 돼요. 캐시 키로 객체를 쓰려면 `Map`(여기처럼) 또는 `WeakMap`이 안전해요. 원본의 입력이 매번 새 객체라면 캐시 적중률이 0이 되니 키 정규화가 필요해요.
tags: [ closure, memoization, cache ]
