id: js-008
category: javascript
difficulty: medium
type: single_choice
question: |
  다음 코드의 출력은?
code: |
  function Dog(name) { this.name = name }
  Dog.prototype.bark = function () { return 'bark' }
  const d = new Dog('coco')
  console.log(d.hasOwnProperty('name'), d.hasOwnProperty('bark'))
choices:
  - id: a
    text: true false
  - id: b
    text: true true
  - id: c
    text: false true
  - id: d
    text: false false
answer: a
explanation: |
  `name`은 생성자 안에서 `this.name = name`으로 인스턴스 자신에게 직접 박아 넣은 속성이라 → `hasOwnProperty('name')`은 `true`예요.
  `bark`는 `Dog.prototype`에 정의돼 있어요. `d.bark()`처럼 호출은 되지만 그건 프로토타입 체인을 따라가서 찾는 거고, `d` 자신이 갖고 있는 속성은 아니라서 `hasOwnProperty('bark')`는 `false`예요.
  → 인스턴스 own property와 프로토타입 체인을 구분하는 게 포인트예요.
tags: [ prototype, inheritance, hasOwnProperty ]
