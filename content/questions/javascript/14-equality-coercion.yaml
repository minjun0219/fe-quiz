id: js-014
category: javascript
difficulty: medium
type: single_choice
question: |
  다음 비교 표현식 중 `true`로 평가되는 것을 모두 고른 묶음은?
code: |
  // (1) null == undefined
  // (2) NaN === NaN
  // (3) 0 == false
  // (4) '' == 0
choices:
  - id: a
    text: (1)만
  - id: b
    text: (1), (3), (4)
  - id: c
    text: (1), (3)만
  - id: d
    text: 전부
answer: b
explanation: |
  - (1) `null == undefined`는 명세상 특별 케이스로 `true`예요. `===`는 타입까지 보니 `false`예요.
  - (2) `NaN`은 자기 자신과도 같지 않다고 정의돼 있어 `NaN === NaN`은 항상 `false`예요. 판별은 `Number.isNaN(x)`로 해요.
  - (3) `0 == false`: `==`는 boolean을 숫자(0/1)로 변환 후 비교 → `0 == 0` → `true`예요.
  - (4) `'' == 0`: 빈 문자열은 숫자로 캐스팅 시 `0` → `0 == 0` → `true`예요.
  팀 코드에서 `==`를 쓰면 이런 암묵 변환이 깔리니 의도가 명확하지 않다면 `===`로 통일하는 게 안전해요.
tags: [ equality, coercion, nan ]
