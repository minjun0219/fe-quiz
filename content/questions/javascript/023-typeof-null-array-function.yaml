    url: https://developer.mozilla.org/ko/docs/Web/JavaScript/Reference/Operators/typeof
  - title: MDN — Array.isArray()
    url: https://developer.mozilla.org/ko/docs/Web/JavaScript/Reference/Global_Objects/Array/isArray
