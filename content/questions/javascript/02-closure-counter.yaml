id: js-002
category: javascript
difficulty: medium
type: single_choice
question: |
  다음 코드의 출력은?
code: |
  function makeCounter() {
    let count = 0
    return () => ++count
  }
  const a = makeCounter()
  const b = makeCounter()
  a(); a(); b()
  console.log(a(), b())
choices:
  - id: a
    text: 3 1
  - id: b
    text: 2 2
  - id: c
    text: 3 2
  - id: d
    text: 1 1
answer: c
explanation: |
  `makeCounter`를 두 번 호출했으니 `a`와 `b`는 서로 다른 클로저(=다른 `count` 변수)를 잡아요.
  `a()`는 두 번 호출돼서 count(a)=2까지 올라간 상태, 마지막 `a()`에서 ++ 돼서 3을 반환해요.
  `b()`는 한 번 호출돼서 count(b)=1, 마지막 `b()`에서 ++ 돼서 2를 반환해요.
  → "3 2". 같은 함수에서 만든 인스턴스라도 클로저는 호출마다 새로 생긴다는 게 포인트예요.
tags: [ closure, scope ]
