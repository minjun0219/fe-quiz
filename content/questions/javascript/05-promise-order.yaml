id: js-005
category: javascript
difficulty: hard
type: multiple_choice
question: |
  다음 코드의 출력 순서는?
code: |
  console.log('A')
  setTimeout(() => console.log('B'))
  Promise.resolve().then(() => console.log('C'))
  async function f() {
    console.log('D')
    await Promise.resolve()
    console.log('E')
  }
  f()
  console.log('F')
choices:
  - "A, D, F, E, C, B"
  - "A, D, F, C, E, B"
  - "A, B, C, D, E, F"
  - "A, F, D, C, E, B"
answer: 1
explanation: |
  동기 코드부터: `A` → `f()` 호출 → `D` (await 만나서 일시 중단) → `F`. 여기까지 동기 한 사이클.
  마이크로태스크 큐엔 먼저 등록된 `Promise.resolve().then(C)`가 앞에 있고, 그 뒤에 `await` 다음에 이어지는 `E`가 들어가.
  → 마이크로태스크 처리: `C` → `E`.
  매크로태스크인 `setTimeout(B)`는 마이크로태스크 큐가 다 비워진 다음에야 실행 → `B`.
  최종: `A, D, F, C, E, B`.
tags: [promise, async, await, event-loop, microtask]
