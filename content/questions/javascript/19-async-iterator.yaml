id: js-019
category: javascript
difficulty: hard
type: single_choice
question: |
  다음 코드의 출력 순서는?
code: |
  async function* gen() {
    yield 1
    yield Promise.resolve(2)
    yield 3
  }
  ;(async () => {
    for await (const v of gen()) {
      console.log(v)
    }
    console.log('done')
  })()
choices:
  - id: a
    text: "`1`, `Promise { 2 }`, `3`, `done` — Promise가 풀리지 않고 객체 그대로 로깅된다"
  - id: b
    text: "`1`, `2`, `3`, `done` — `for await...of`는 yield된 값이 Promise면 한 번 더 자동 await해 일반 값으로 넘겨준다"
  - id: c
    text: "`1`, `3`, `2`, `done` — Promise는 마이크로태스크로 미뤄져 마지막에 처리된다"
  - id: d
    text: "TypeError — async generator는 Promise를 yield할 수 없다"
answer: b
explanation: |
  async generator의 `next()`는 `{ value, done }`을 담은 **Promise**를 돌려줘. `for await...of`는 이걸 두 단계로 풀어준다:
  1차로 `next()`가 돌려준 Promise를 await해서 `{ value, done }`을 꺼내고, `value`가 또 Promise면 2차로 한 번 더 await해서 실제 값을 루프 변수에 바인딩해.
  그래서 `Promise.resolve(2)`가 yield돼도 본문에선 이미 풀린 `2`가 들어오고, 출력은 `1`, `2`, `3`, `done`이야.
  - a: Promise는 자동으로 풀리니까 객체 형태 그대로 찍히지 않아.
  - c: yield 순서 자체는 보존돼 — Promise라고 뒤로 미뤄지는 게 아니야.
  - d: async generator는 동기 값이든 Promise든 자유롭게 yield할 수 있어.
  HTTP 스트리밍·파일 청크 읽기처럼 "비동기로 도착하는 시퀀스"를 다룰 때 자연스럽게 쓸 수 있어.
tags: [ async-iterator, generator, for-await ]
