id: css-005
category: css
difficulty: medium
type: multiple_choice
question: |
  아래 HTML/CSS에서 `<p>`의 텍스트 색은?
code: |
  /* CSS */
  #main .box p { color: red; }
  .box p.text { color: blue; }
  p { color: green; }

  <!-- HTML -->
  <div id="main">
    <div class="box">
      <p class="text">hi</p>
    </div>
  </div>
choices:
  - "red"
  - "blue"
  - "green"
  - "선언 순서상 마지막인 green"
answer: 0
explanation: |
  명시도(specificity)는 (id, class/속성/가상클래스, 요소/가상요소) 순으로 비교해.
  - `#main .box p` → (1, 1, 1)
  - `.box p.text`  → (0, 2, 1)
  - `p`            → (0, 0, 1)
  id가 1개인 첫 번째가 가장 높아서 **red** 승리. 선언 순서는 명시도가 같을 때만 의미가 있어.
  실무 팁: id 셀렉터를 마구 쓰면 나중에 덮어쓰기가 어려워지니까, 가능하면 클래스 조합으로 다루는 게 유지보수에 좋아.
tags: [specificity, selector, cascade]
