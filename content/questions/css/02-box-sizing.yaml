id: css-002
category: css
difficulty: easy
type: single_choice
question: |
  아래 박스의 실제 콘텐츠 영역 너비는?
code: |
  .box {
    width: 200px;
    padding: 20px;
    border: 5px solid;
    box-sizing: border-box;
  }
choices:
  - id: a
    text: 200px
  - id: b
    text: 150px
  - id: c
    text: 230px
  - id: d
    text: 250px
answer: b
explanation: |
  `box-sizing: border-box`는 `width`가 **border + padding + content**를 모두 포함한 박스의 전체 너비라는 뜻이에요.
  그래서 콘텐츠 영역 = 200 - (padding 20×2) - (border 5×2) = 200 - 40 - 10 = **150px**.
  반대로 기본값인 `content-box`였다면 `width: 200px`이 콘텐츠 영역 자체라 박스 전체는 250px이 됐을 거예요. 모던 프로젝트에서 `* { box-sizing: border-box }`를 깔고 가는 이유랍니다.
tags: [ box-model, box-sizing ]
