id: css-019
category: css
difficulty: hard
type: single_choice
question: |
  다음 `@container` 쿼리가 `@media (min-width: 400px)`와 다른 점으로 가장 정확한 것은?
code: |
  .card-container { container-type: inline-size; }
  @container (min-width: 400px) {
    .card { display: grid; grid-template-columns: 1fr 1fr; }
  }
choices:
  - id: a
    text: 둘은 동일하며 `@container`는 `@media`의 별칭이다
  - id: b
    text: "`@container`는 가장 가까운 컨테이너(`container-type` 지정 조상)의 크기를 기준으로 매칭되므로, 같은 카드라도 사이드바에선 1단으로 메인에선 2단으로 자연스럽게 적응할 수 있다. `@media`는 항상 viewport 기준이다"
  - id: c
    text: "`@container`는 viewport보다 작은 영역에서는 동작하지 않는다"
  - id: d
    text: "`@container`는 JS 런타임에서만 평가되며 빌드 타임에 미리 계산할 수 없다"
answer: b
explanation: |
  Container query는 "부모 컨테이너의 사이즈"를 기준으로 자식의 스타일을 결정해서, 같은 카드 컴포넌트가 폭 좁은 사이드바에 들어가면 1단, 넓은 메인 영역에 들어가면 2단으로 자동 분기되도록 작성할 수 있어. 컴포넌트 단위로 반응형을 짜는 데 강력해.
  쓰려면 조상 어딘가에 `container-type` (또는 `container-name`까지)을 지정해야 해. 매칭되는 size 컨테이너가 하나도 없으면 viewport로 폴백되는 게 아니라 그냥 그 `@container` 규칙이 적용되지 않으니, 컨테이너 선언이 빠졌는지 먼저 확인해.
  Chrome/Safari/Firefox 모두 2023년 이후 안정 지원이라 신규 컴포넌트 시스템에서 도입할 만한 시점이야.
tags: [ container-queries, responsive, modern-css ]
