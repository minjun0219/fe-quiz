id: css-001
category: css
difficulty: easy
type: single_choice
question: |
  flex 컨테이너에서 자식 아이템을 main axis 양 끝에 붙이고, 사이사이는 균등 간격으로 배치하려면?
choices:
  - id: a
    text: "justify-content: space-between"
  - id: b
    text: "justify-content: space-around"
  - id: c
    text: "justify-content: space-evenly"
  - id: d
    text: "justify-content: stretch"
answer: a
explanation: |
  - `space-between`: 양 끝 아이템이 컨테이너 가장자리에 딱 붙고, 사이 간격만 균등.
  - `space-around`: 각 아이템 양옆에 동일한 마진(가장자리 마진은 사이 마진의 절반).
  - `space-evenly`: 가장자리 포함 모든 간격이 동일.
  - `stretch`: 명세상 `justify-content`의 유효 값이지만, flex 컨테이너의 main axis에서는 늘이기가 적용 안 돼 결과적으로 `flex-start`처럼 동작. (CSS Grid에선 실제로 트랙이 늘어남)
tags: [ flexbox, layout, justify-content ]
