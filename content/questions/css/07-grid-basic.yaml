id: css-007
category: css
difficulty: easy
type: single_choice
question: |
  아래 grid 컨테이너에 자식 요소 7개를 넣으면 어떻게 배치될까요?
code: |
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
choices:
  - id: a
    text: 3열 × 7행, 매 행에 자식 하나씩
  - id: b
    text: 7열 × 1행, 1fr씩 균등 분할
  - id: c
    text: 3열 × 3행, 마지막 행에는 1개만 채워지고 나머지 2칸은 비어 있어요
  - id: d
    text: 1열 × 7행
answer: c
explanation: |
  `grid-template-columns: repeat(3, 1fr)`은 "3열, 각 열은 남은 공간을 1:1:1로 나눠 가져라"라는 뜻이에요.
  자식이 7개니까 자연스럽게 줄바꿈되어 3 + 3 + 1로 들어가서 행이 3개 만들어져요 (`grid-auto-rows`로 행이 자동 생성).
  마지막 행의 빈 2칸은 비어 있는 grid cell이고, 다음 자식이 추가되면 거기부터 채워져요.

  참고: [MDN — grid-template-columns](https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-columns)
tags: [ grid, layout, repeat ]
