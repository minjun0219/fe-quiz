id: next-004
category: nextjs
difficulty: hard
type: single_choice
question: |
  App Router에서 Streaming SSR과 `Suspense`를 함께 쓰는 이유로 가장 알맞은 것은?
choices:
  - id: a
    text: 느린 데이터 영역을 기다리는 동안 먼저 준비된 UI와 fallback을 보내 사용자가 더 빨리 화면을 보기 위해서다.
  - id: b
    text: 모든 JavaScript를 제거해 Client Component 사용을 금지하기 위해서다.
  - id: c
    text: 서버 렌더링을 중단하고 CSR만 사용하도록 강제하기 위해서다.
  - id: d
    text: 이미지 파일을 자동으로 WebP로 변환하기 위해서다.
answer: a
explanation: |
  Streaming SSR은 서버에서 준비된 HTML 조각을 순차적으로 보낼 수 있고, `Suspense`는 느린 부분의 경계를 나눠 fallback을 먼저 보여줄 수 있게 해. 덕분에 전체 데이터가 다 끝날 때까지 빈 화면으로 기다리는 시간을 줄일 수 있다.
tags: [ streaming-ssr, suspense, app-router, rendering ]
