id: next-003
category: nextjs
difficulty: medium
type: single_choice
question: |
  Next.js Server Actions에 대한 설명으로 가장 알맞은 것은?
choices:
  - id: a
    text: 서버에서 실행되는 함수를 form action이나 클라이언트 호출 경로와 연결해 mutation을 처리할 수 있다.
  - id: b
    text: 브라우저 번들에 데이터베이스 secret을 포함해 클라이언트에서 직접 쿼리하게 해준다.
  - id: c
    text: 정적 HTML만 만들 수 있어서 사용자 입력 처리는 불가능하다.
  - id: d
    text: Server Component를 모두 Client Component로 바꾸는 기능이다.
answer: a
explanation: |
  Server Actions는 서버에서 실행되는 함수를 액션으로 노출해 form 제출이나 mutation 흐름을 다룰 수 있게 해. 서버에서 실행되므로 secret 접근이나 DB 작업을 클라이언트 번들에 노출하지 않는 방향으로 설계할 수 있지만, 인증/검증은 여전히 서버에서 명확히 해야 한다.
tags: [ server-actions, mutation, app-router ]
