id: next-002
category: nextjs
difficulty: medium
type: single_choice
question: |
  Next.js App Router의 `fetch` 캐시 옵션 설명으로 맞는 것은?
choices:
  - id: a
    text: '`cache: "no-store"`는 요청 결과를 저장하지 않고 매 요청 새로 가져오려는 의도에 가깝다.'
  - id: b
    text: '`next: { revalidate: 60 }`은 브라우저가 60초마다 강제로 새로고침한다는 뜻이다.'
  - id: c
    text: 모든 `fetch`는 기본적으로 사용자 쿠키와 무관하게 영구 캐시된다.
  - id: d
    text: 캐시 옵션은 Client Component에서만 동작하고 Server Component에서는 무시된다.
answer: a
explanation: |
  App Router에서 `cache: "no-store"`는 서버 렌더링 중 데이터를 캐시하지 않고 동적으로 가져오려는 선택이야. `next: { revalidate: 60 }`은 서버 측 재검증 주기를 지정하는 개념이지 브라우저 새로고침 명령이 아니다.
tags: [ app-router, fetch-cache, revalidate ]
