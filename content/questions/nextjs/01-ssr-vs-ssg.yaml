id: next-001
category: nextjs
difficulty: easy
type: single_choice
question: |
  Next.js에서 SSR과 SSG 선택 기준으로 가장 알맞은 것은?
choices:
  - id: a
    text: SSR은 요청마다 최신 데이터가 필요할 때, SSG는 빌드 시점 결과를 재사용해도 되는 정적 콘텐츠에 적합하다.
  - id: b
    text: SSR은 항상 CDN 캐싱이 불가능하고, SSG는 사용자별 데이터를 안전하게 포함할 수 있다.
  - id: c
    text: SSG는 매 요청 서버에서 HTML을 만들고, SSR은 빌드 시 한 번만 만든다.
  - id: d
    text: 둘의 차이는 파일 확장자가 `.tsx`인지 `.jsx`인지뿐이다.
answer: a
explanation: |
  SSR은 사용자의 요청이 들어올 때 서버에서 HTML을 만들어 응답하므로, 로그인 사용자별 화면이나 자주 바뀌는 데이터처럼 요청 시점 정보가 중요한 페이지에 적합해요.
  SSG는 빌드 시점에 HTML을 만들어 두고 CDN에서 빠르게 제공하기 좋아서 문서·마케팅 페이지·블로그처럼 내용이 비교적 고정된 화면에 잘 맞습니다. 실제 Next.js 앱에서는 ISR, fetch cache, 동적 렌더링을 섞어 최신성과 응답 속도 사이의 균형을 잡아요.
tags: [ ssr, ssg, rendering ]
