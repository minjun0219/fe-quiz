id: perf-003
category: performance
difficulty: medium
type: multi_choice
question: |
  CLS를 줄이는 데 도움이 되는 방법을 모두 고르면?
choices:
  - id: a
    text: 이미지와 광고 영역에 미리 `width`, `height` 또는 `aspect-ratio`를 지정한다.
  - id: b
    text: 웹 폰트 교체로 레이아웃이 흔들리지 않도록 폰트 로딩 전략을 조정한다.
  - id: c
    text: 첫 화면 위쪽에 동적으로 배너를 삽입할 때 기존 콘텐츠를 아래로 밀어도 예약 공간은 두지 않는다.
  - id: d
    text: 스켈레톤이나 placeholder로 늦게 도착하는 콘텐츠의 공간을 확보한다.
answer: [a, b, d]
explanation: |
  CLS는 페이지 로딩 중 또는 사용 중에 요소가 갑자기 움직여 사용자가 잘못 클릭하거나 읽던 위치를 잃는 문제를 수치화한 지표야. 이미지·광고·임베드처럼 늦게 로드되는 요소는 `width`, `height`, `aspect-ratio` 등으로 공간을 미리 확보하는 게 중요해.
  웹 폰트 교체로 글자 폭이 크게 달라지는 경우도 레이아웃 이동을 만들 수 있으므로 폰트 로딩 전략을 조정해야 해. 상단에 예약 공간 없이 배너를 삽입하면 기존 콘텐츠가 아래로 밀리기 때문에 CLS를 악화시키는 대표 패턴이다.
tags: [ cls, layout-shift, font-loading, image ]
